name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cuvasol-marketing-production
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test

      - name: Build frontend
        run: npm run build

  deploy:
    name: Deploy to AWS
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::886136157742:role/CuvasolMarketingGitHubDeployRole
          aws-region: ap-south-1

      - name: Start deployment through Systems Manager
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          PARAMS=$(jq -nc --arg sha "${GITHUB_SHA}" '{commands:[
            "set -euo pipefail",
            "export RELEASE_SHA=" + $sha,
            "release_dir=/opt/cuvasol-marketing/releases/" + $sha,
            "if [ ! -d \"$release_dir/.git\" ]; then git clone --no-checkout https://github.com/sairam0043/marketing_cuvasol.git \"$release_dir\"; fi",
            "git -C \"$release_dir\" fetch --prune origin",
            "git -C \"$release_dir\" checkout --detach \"$RELEASE_SHA\"",
            "bash \"$release_dir/scripts/deploy-production.sh\""
          ]}')
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0de607fa5d99534de \
            --document-name AWS-RunShellScript \
            --comment "Deploy ${GITHUB_SHA} from GitHub Actions" \
            --parameters "${PARAMS}" \
            --query 'Command.CommandId' \
            --output text)
          echo "command_id=${COMMAND_ID}" >> "${GITHUB_OUTPUT}"

      - name: Wait for deployment
        shell: bash
        env:
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
        run: |
          set -euo pipefail
          aws ssm wait command-executed \
            --command-id "${COMMAND_ID}" \
            --instance-id i-0de607fa5d99534de
          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id i-0de607fa5d99534de \
            --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}'

      - name: Verify production
        run: |
          curl --fail --silent --show-error https://marketing.cuvasol.com/ >/dev/null
          curl --fail --silent --show-error https://marketing.cuvasol.com/api/health >/dev/null
